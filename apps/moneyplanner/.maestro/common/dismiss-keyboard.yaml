# Closes the keyboard after typing into a NUMERIC field (decimal-pad / number-pad).
# iPhone number pads have no Return key, so the app shows a "Done" bar above them
# (testID keyboard-done, label "Done"). Android: the normal hideKeyboard works.
# For text fields use dismiss-text-keyboard.yaml.
# This file lives in a subfolder so `maestro test .maestro/` does not run it as a flow.
appId: com.shefoo.moneyplanner
---
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: keyboard-done
          optional: true
      - tapOn:
          text: "Done"
          optional: true
      # Fallback, only if the number pad is still up: scrolling the form closes
      # the keyboard too (keyboardDismissMode on-drag).
      - runFlow:
          when:
            visible:
              id: dictation
          commands:
            - scroll
