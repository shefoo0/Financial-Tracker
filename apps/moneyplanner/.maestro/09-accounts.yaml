# Settings -> Accounts: the main account is listed and can be renamed (milestone 3b; free and Pro).
appId: com.shefoo.moneyplanner
name: Accounts
---
- launchApp:
    clearState: true
# Wizard: go on until Start is shown.
- repeat:
    while:
      notVisible:
        id: onboarding-start
    commands:
      - tapOn:
          id: onboarding-next
- tapOn:
    id: onboarding-start
- tapOn: "Settings"
- assertVisible:
    id: settings-screen
- scrollUntilVisible:
    element:
      id: settings-accounts
    direction: DOWN
- tapOn:
    id: settings-accounts
- assertVisible:
    id: accounts-screen
- tapOn:
    id: account-main
- tapOn:
    id: account-name
- eraseText: 30
- inputText: "ENBD current"
- runFlow: common/dismiss-text-keyboard.yaml
- tapOn:
    id: account-save
- assertVisible: "ENBD current"
