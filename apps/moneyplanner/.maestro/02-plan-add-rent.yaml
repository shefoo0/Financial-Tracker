# Plan -> add cost "Rent" 9500 -> appears on Plan and in Month. Starts from an empty (skipped) setup.
appId: com.shefoo.moneyplanner
name: Add a recurring cost
---
- launchApp:
    clearState: true
- tapOn:
    id: onboarding-next
# The number of wizard steps can vary, so go on until Start is shown.
- repeat:
    while:
      notVisible:
        id: onboarding-start
    commands:
      - tapOn:
          id: onboarding-next
- tapOn:
    id: onboarding-start
# Empty dashboard
- assertVisible: "Welcome to Money Planner"
- tapOn: "Plan"
- assertVisible: "Plan your regular money"
- tapOn:
    id: plan-add-cost
- assertVisible:
    id: recurring-screen
- tapOn:
    id: recurring-name
- inputText: "Rent"
- runFlow: common/dismiss-text-keyboard.yaml
- tapOn:
    id: recurring-amount
- inputText: "9500"
- runFlow: common/dismiss-keyboard.yaml
# Keep the default schedule (monthly, starting today): the day field is far down the form.
- scrollUntilVisible:
    element:
      id: recurring-save-bottom
    direction: DOWN
- tapOn:
    id: recurring-save-bottom
- assertNotVisible:
    id: recurring-screen
- assertVisible:
    id: plan-screen
# On iPhone a row reads as one label ("Rent, AED 9,500.00, ..."), so match the start.
- assertVisible: "Rent.*"
- assertVisible: "Total ≈ AED 9,500.00 / month"
- tapOn: "Month"
- assertVisible:
    id: month-screen
# The month's items are listed under the summary: scroll to Rent.
- scrollUntilVisible:
    element: "Rent.*"
    direction: DOWN
