# Month -> add one-time item -> appears in Month.
appId: com.shefoo.moneyplanner
name: Add a one-time item
---
- launchApp:
    clearState: true
- tapOn:
    id: onboarding-next
# The number of wizard steps can vary, so go on until Start is shown.
- repeat:
    while:
      notVisible:
        id: onboarding-start
    commands:
      - tapOn:
          id: onboarding-next
- tapOn:
    id: onboarding-start
- tapOn: "Month"
- assertVisible: "Nothing in this month"
- tapOn:
    id: month-add-item
- assertVisible:
    id: transaction-screen
- tapOn:
    id: transaction-description
- inputText: "Taxi"
- hideKeyboard
- tapOn:
    id: transaction-amount
- inputText: "45"
- hideKeyboard
- tapOn:
    id: transaction-save-bottom
- assertVisible:
    id: month-screen
- assertVisible: "Taxi"
- assertNotVisible: "Nothing in this month"
