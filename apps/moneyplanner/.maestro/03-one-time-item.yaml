# Month -> add one-time item -> appears in Month.
appId: com.shefoo.moneyplanner
name: Add a one-time item
---
- launchApp:
    clearState: true
- tapOn:
    id: onboarding-next
# The number of wizard steps can vary, so go on until Start is shown.
- repeat:
    while:
      notVisible:
        id: onboarding-start
    commands:
      - tapOn:
          id: onboarding-next
- tapOn:
    id: onboarding-start
- tapOn: "Month"
# The empty message sits under the month summary: scroll to it.
- scrollUntilVisible:
    element: "Nothing in this month"
    direction: DOWN
- tapOn:
    id: month-add-item
- assertVisible:
    id: transaction-screen
- tapOn:
    id: transaction-description
- inputText: "Taxi"
- runFlow: common/dismiss-text-keyboard.yaml
- scrollUntilVisible:
    element:
      id: transaction-amount
    direction: DOWN
- tapOn:
    id: transaction-amount
- inputText: "45"
- runFlow: common/dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: transaction-save-bottom
    direction: DOWN
- tapOn:
    id: transaction-save-bottom
# The form closes and the new item is listed in Month.
- assertNotVisible:
    id: transaction-screen
- assertVisible:
    id: month-screen
- assertVisible:
    id: month-item-0
# On iPhone a row reads as one label ("Taxi, cost AED 45.00, ..."), so match the start.
- assertVisible: "Taxi.*"
- assertNotVisible: "Nothing in this month"
