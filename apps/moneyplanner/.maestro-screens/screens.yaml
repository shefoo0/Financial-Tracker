# Store and review screenshots: sets up a realistic plan, then captures each main
# screen. Run by the "iOS simulator test" workflow (not part of the test suite).
appId: com.shefoo.moneyplanner
name: Screenshots of the main screens
---
- launchApp:
    clearState: true
- tapOn:
    id: onboarding-salary
- inputText: "18000"
- runFlow: ../.maestro/common/dismiss-keyboard.yaml
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-payday
- scrollUntilVisible:
    element:
      id: onboarding-payday-option-25
    visibilityPercentage: 50
    direction: DOWN
- tapOn:
    id: onboarding-payday-option-25
- takeScreenshot: shots/01-setup
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-balance
- inputText: "6500"
- runFlow: ../.maestro/common/dismiss-keyboard.yaml
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-start
- assertVisible:
    id: dashboard-screen
- tapOn: "Plan"
- tapOn:
    id: plan-add-cost
- tapOn:
    id: recurring-name
- inputText: "Rent"
- runFlow: ../.maestro/common/dismiss-text-keyboard.yaml
- tapOn:
    id: recurring-amount
- inputText: "9500"
- runFlow: ../.maestro/common/dismiss-keyboard.yaml
- tapOn:
    id: recurring-category
- scrollUntilVisible:
    element:
      id: recurring-category-option-housing
    direction: DOWN
- tapOn:
    id: recurring-category-option-housing
- takeScreenshot: shots/02-recurring-form
- tapOn:
    id: recurring-save
- takeScreenshot: shots/03-plan
- tapOn: "Home"
- takeScreenshot: shots/04-dashboard
- tapOn: "Month"
- takeScreenshot: shots/05-month
- tapOn: "Settings"
- takeScreenshot: shots/06-settings
