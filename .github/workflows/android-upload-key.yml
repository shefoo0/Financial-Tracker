# Creates the Android upload key ONCE, so you never need Java or Android tools
# on your own computer. Google Play App Signing holds the real app signing key;
# this upload key only proves that uploads come from you, and Google support
# can reset it if it's ever lost.
#
# Run: Actions -> "Android upload key" -> Run workflow, type "create".
# Then, within a day:
#   1. Download the "android-upload-key" artifact from the run.
#   2. Save upload.jks and SECRETS.txt in your password manager (your backup).
#   3. Add the four secrets from SECRETS.txt under Settings -> Secrets and
#      variables -> Actions -> New repository secret.
#   4. Delete the run (or at least its artifact), and delete the downloaded files
#      from your Downloads folder.
#
# It refuses to run on a public repository, and refuses to replace an existing
# key unless you type "replace" (after your first Google Play upload, a new
# key only works once Google support has reset it).

name: Android upload key
run-name: Create the Android upload key

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "create" (or "replace" to overwrite an existing key)'
        required: true
        type: string

permissions:
  contents: read

# `shell: bash` makes a failure anywhere in a pipeline fail the step (pipefail).
defaults:
  run:
    shell: bash

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIRM: ${{ inputs.confirm }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      IS_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Safety checks
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::This repository is public, so anyone could download the key. Make it private first."
            exit 1
          fi
          if [ "$HAS_KEY" = "true" ] && [ "$CONFIRM" != "replace" ]; then
            echo "::error::An upload key already exists in this repository's secrets. Type \"replace\" only if you really mean to replace it."
            exit 1
          fi
          if [ "$CONFIRM" != "create" ] && [ "$CONFIRM" != "replace" ]; then
            echo "::error::Type \"create\" to make the key."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the key
        run: |
          password="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 32)"
          echo "::add-mask::$password"
          mkdir key
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore key/upload.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$password" -keypass "$password" \
            -dname "CN=Android Upload Key" >/dev/null 2>&1
          base64 -w0 key/upload.jks > key/upload.jks.base64.txt
          cat > key/SECRETS.txt <<EOF
          Add these four repository secrets (Settings -> Secrets and variables -> Actions):

          ANDROID_KEYSTORE_BASE64   = the whole contents of upload.jks.base64.txt
          ANDROID_KEYSTORE_PASSWORD = $password
          ANDROID_KEY_ALIAS         = upload
          ANDROID_KEY_PASSWORD      = $password

          Keep upload.jks and this password in your password manager as a backup.
          Then delete this workflow run and these downloaded files.
          EOF
          keytool -list -keystore key/upload.jks -storepass "$password" | grep -i "fingerprint" || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-key
          path: key/
          retention-days: 1
          if-no-files-found: error

      - name: Next steps
        run: |
          {
            echo "### Upload key created"
            echo
            echo "1. Download **android-upload-key** below (it's deleted automatically after 1 day)."
            echo "2. Save \`upload.jks\` and \`SECRETS.txt\` in your password manager."
            echo "3. Add the four secrets from \`SECRETS.txt\` under Settings → Secrets and variables → Actions."
            echo "4. Delete this run, and delete the downloaded files."
          } >> "$GITHUB_STEP_SUMMARY"
